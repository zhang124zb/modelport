name: 缺陷报告
description: 报告可复现的普通功能问题；安全漏洞请使用私密渠道。
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        请先检索已有 Issue。安全漏洞请按 SECURITY.md 私密报告，不要在这里披露。
        不要提交 API Key、MCP 令牌、私人地址、聊天备份、附件原件或个人信息；日志和截图必须脱敏。
  - type: input
    id: version
    attributes:
      label: ModelPort 版本
      description: 发布版本号，或源码运行时的提交版本。
      placeholder: 例如 0.11.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: Windows 版本、发布程序或源码运行；源码问题可注明 Node.js / Rust 版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 使用虚构内容描述最小复现过程；涉及模型时写提供商与模型名称，不要填密钥。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如有错误提示，请提供经过脱敏的内容。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图（可选）
      description: 上传前自行检查是否包含令牌、账户、私人文档或文件路径信息。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已检查内容，不包含密钥、令牌、私密资料；本报告不是安全漏洞披露。
          required: true
