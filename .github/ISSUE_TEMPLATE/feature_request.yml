name: 功能建议
description: 提出一个具体的使用需求或改进。
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        请先检索已有建议。使用虚构示例，不要提交密钥、令牌、私人文档或聊天备份。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述使用场景，而不仅是按钮名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 简述预期效果和必要的安全提示。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法（可选）
  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）
      description: 涉及外部服务时可提供公开文档，不要填私人端点或访问凭据。
