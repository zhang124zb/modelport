[package]
name = "modelport"
version = "0.12.0"
description = "A local-first multi-model AI desktop client"
license = "MIT"
authors = ["ModelPort contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "modelport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "4.2", default-features = false, features = ["v1", "windows-native-keyring-store"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "net"] }
futures-util = "0.3"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sha2 = "0.10.9"
tempfile = "3.27"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
png = "0.17"
jsonschema = { version = "0.58.6", default-features = false }


# Development keeps checks enabled but avoids large symbols/incremental caches.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
